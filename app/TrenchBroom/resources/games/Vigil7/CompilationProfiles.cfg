{
	"profiles": [
		{
			"name": "Default Build",
			"tasks": [
				{
					"enabled": true,
					"parameters": "-bsp ${MAP_BASE_NAME}.map",
					"tool": "${BITOOLS}\\bimap.exe",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "-vis ${MAP_BASE_NAME}.bsp",
					"tool": "${BITOOLS}\\bimap.exe",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "-rad -embree ${MAP_BASE_NAME}.bsp",
					"tool": "${BITOOLS}\\bimap.exe",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		},
		{
			"name": "One-Shot - Embree, 32 Samples",
			"tasks": [
				{
					"enabled": true,
					"parameters": "-bsp -vis -rad -embree -samples 32 ${MAP_BASE_NAME}.map",
					"tool": "${BITOOLS}\\bimap.exe",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
